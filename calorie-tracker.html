<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מעקב קלוריות יומי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --surface: #1a1925;
    --surface2: #252336;
    --accent: #ff6b6b;
    --accent2: #ffd93d;
    --accent3: #6bcb77;
    --text: #fffffe;
    --muted: #a7a9be;
    --border: rgba(255,255,255,0.07);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* Background grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 32px;
  }

  .date-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  h1 {
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 0%, var(--muted) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Ring + calories */
  .ring-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
  }

  .ring-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 12px;
  }

  .ring-wrap svg {
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--surface2);
    stroke-width: 14;
  }

  .ring-fill {
    fill: none;
    stroke-width: 14;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .cal-consumed {
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
  }

  .cal-unit {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .cal-goal-line {
    font-size: 13px;
    color: var(--muted);
  }

  .cal-remaining {
    font-size: 14px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 100px;
    background: var(--surface2);
  }

  /* Goal setter */
  .goal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--muted);
  }

  .goal-bar input {
    width: 70px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    padding: 4px 8px;
    outline: none;
    margin-right: auto;
  }

  .goal-bar input:focus { border-color: var(--accent); }

  /* Input section */
  .add-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .add-section h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .input-field {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-field:focus { border-color: var(--accent); }
  .input-field::placeholder { color: var(--muted); }

  .input-cal {
    width: 90px;
    flex: none;
    text-align: center;
  }

  .ai-row {
    display: flex;
    gap: 10px;
  }

  .btn {
    border: none;
    border-radius: 12px;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    padding: 12px 20px;
    transition: transform 0.15s, opacity 0.15s;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    flex: 1;
  }

  .btn-ai {
    background: var(--surface2);
    color: var(--accent2);
    border: 1px solid rgba(255,217,61,0.2);
    flex: 1;
    font-size: 13px;
  }

  .btn-ai:hover { opacity: 0.85; }

  /* AI status */
  .ai-status {
    font-size: 12px;
    color: var(--accent2);
    margin-top: 8px;
    min-height: 16px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .ai-status.visible { opacity: 1; }

  /* Meals list */
  .meals-section h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .meal-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .meal-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .meal-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .meal-name {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
  }

  .meal-time {
    font-size: 11px;
    color: var(--muted);
  }

  .meal-cal {
    font-size: 16px;
    font-weight: 900;
    margin-right: 4px;
  }

  .meal-kcal-label {
    font-size: 10px;
    color: var(--muted);
  }

  .meal-delete {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 0 0 0 8px;
    line-height: 1;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .meal-delete:hover { opacity: 1; color: var(--accent); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 32px 0;
  }

  /* reset btn */
  .reset-btn {
    display: block;
    width: 100%;
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'Heebo', sans-serif;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .reset-btn:hover { opacity: 1; color: var(--accent); }

  /* Colors for dots */
  .c1 { background: var(--accent); }
  .c2 { background: var(--accent2); }
  .c3 { background: var(--accent3); }
  .c4 { background: #6bc5cb; }
  .c5 { background: #cb6bcb; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="date-label" id="dateLabel"></div>
    <h1>מה אכלת היום?</h1>
  </header>

  <!-- Ring -->
  <div class="ring-section">
    <div class="ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle class="ring-track" cx="90" cy="90" r="76"/>
        <circle class="ring-fill" id="ringFill" cx="90" cy="90" r="76"
          stroke-dasharray="477.5" stroke-dashoffset="477.5" stroke="var(--accent)"/>
      </svg>
      <div class="ring-center">
        <div class="cal-consumed" id="totalCal">0</div>
        <div class="cal-unit">קלוריות</div>
      </div>
    </div>
    <div class="cal-remaining" id="remainingLabel">נותרו 2000 קק"ל</div>
  </div>

  <!-- Goal -->
  <div class="goal-bar">
    <span>יעד יומי:</span>
    <input type="number" id="goalInput" value="1200" min="500" max="5000">
    <span>קק"ל</span>
  </div>

  <!-- Add meal -->
  <div class="add-section">
    <h2>➕ הוספת אוכל</h2>
    <div class="input-row">
      <input class="input-field" id="foodName" type="text" placeholder="מה אכלת? (לדוגמה: שקדים, 30 גרם)">
    </div>
    <div class="input-row">
      <input class="input-field input-cal" id="foodCal" type="number" placeholder="קלוריות" min="1">
      <button class="btn btn-primary" onclick="addManual()">הוספה</button>
    </div>
    <div class="ai-row">
      <button class="btn btn-ai" onclick="estimateWithAI()">✨ חשב קלוריות עם AI</button>
      <button class="btn btn-ai" onclick="document.getElementById('imgInput').click()" style="color:#6bcb77;border-color:rgba(107,203,119,0.25)">📷 העלי תמונה</button>
    </div>
    <input type="file" id="imgInput" accept="image/*" capture="environment" style="display:none" onchange="handleImage(event)">
    <div id="imagePreview" style="display:none;margin-top:12px;border-radius:12px;overflow:hidden;max-height:180px;">
      <img id="previewImg" style="width:100%;object-fit:cover;max-height:180px;display:block;">
    </div>
    <div class="ai-status" id="aiStatus"></div>
  </div>

  <!-- Meals list -->
  <div class="meals-section">
    <h2>📋 מה אכלת</h2>
    <div class="meal-list" id="mealList"></div>
  </div>

  <button class="reset-btn" onclick="resetDay()">🔄 איפוס יום חדש</button>
</div>

<script>
const STORAGE_KEY = 'calorie_tracker_v1';
const COLORS = ['c1','c2','c3','c4','c5'];
let state = loadState();

function loadState() {
  const today = new Date().toDateString();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.date === today) return saved;
  } catch(e) {}
  return { date: today, goal: 1200, meals: [] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function renderDate() {
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long' });
}

function renderGoal() {
  document.getElementById('goalInput').value = state.goal;
}

function renderRing() {
  const total = state.meals.reduce((s,m) => s + m.cal, 0);
  const goal = state.goal;
  const pct = Math.min(total / goal, 1);
  const circumference = 477.5;
  const offset = circumference - pct * circumference;

  document.getElementById('totalCal').textContent = total.toLocaleString();
  document.getElementById('ringFill').style.strokeDashoffset = offset;

  // color based on pct
  const ring = document.getElementById('ringFill');
  if (pct >= 1) ring.style.stroke = 'var(--accent)';
  else if (pct >= 0.75) ring.style.stroke = 'var(--accent2)';
  else ring.style.stroke = 'var(--accent3)';

  const rem = goal - total;
  const label = document.getElementById('remainingLabel');
  if (rem > 0) {
    label.textContent = `נותרו ${rem.toLocaleString()} קק"ל`;
    label.style.color = 'var(--text)';
  } else {
    label.textContent = `חרגת ב-${Math.abs(rem).toLocaleString()} קק"ל`;
    label.style.color = 'var(--accent)';
  }
}

function renderMeals() {
  const list = document.getElementById('mealList');
  if (!state.meals.length) {
    list.innerHTML = '<div class="empty-state">עדיין לא הוספת ארוחות היום ✨</div>';
    return;
  }
  list.innerHTML = state.meals.slice().reverse().map((m, i) => {
    const colorIdx = (state.meals.length - 1 - i) % COLORS.length;
    return `
    <div class="meal-item">
      <div class="meal-dot ${COLORS[colorIdx]}"></div>
      <div class="meal-name">${escHtml(m.name)}</div>
      <div class="meal-time">${formatTime(m.ts)}</div>
      <div>
        <span class="meal-cal" style="color:var(--${COLORS[colorIdx] === 'c1' ? 'accent' : COLORS[colorIdx] === 'c2' ? 'accent2' : 'accent3'})">${m.cal}</span>
        <span class="meal-kcal-label">קק"ל</span>
      </div>
      <button class="meal-delete" onclick="deleteMeal(${state.meals.length - 1 - i})">×</button>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  renderDate();
  renderGoal();
  renderRing();
  renderMeals();
}

function addManual() {
  const name = document.getElementById('foodName').value.trim();
  const cal = parseInt(document.getElementById('foodCal').value);
  if (!name) { alert('אנא הזיני שם מזון'); return; }
  if (!cal || cal < 1) { alert('אנא הזיני מספר קלוריות תקין'); return; }
  addMeal(name, cal);
}

function addMeal(name, cal) {
  state.meals.push({ name, cal, ts: Date.now() });
  saveState();
  document.getElementById('foodName').value = '';
  document.getElementById('foodCal').value = '';
  render();
}

function deleteMeal(idx) {
  state.meals.splice(idx, 1);
  saveState();
  render();
}

function resetDay() {
  if (!confirm('לאפס את כל נתוני היום?')) return;
  state.meals = [];
  saveState();
  render();
}

document.getElementById('goalInput').addEventListener('change', function() {
  const v = parseInt(this.value);
  if (v >= 500 && v <= 5000) { state.goal = v; saveState(); render(); }
});

document.getElementById('foodName').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const cal = document.getElementById('foodCal').value;
    if (cal) addManual(); else estimateWithAI();
  }
});

async function estimateWithAI() {
  const name = document.getElementById('foodName').value.trim();
  if (!name) { alert('אנא כתבי מה אכלת'); return; }

  const statusEl = document.getElementById('aiStatus');
  statusEl.textContent = '⏳ מחשב קלוריות...';
  statusEl.classList.add('visible');

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 100,
        system: "You are a calorie estimation assistant. When given a food item (possibly in Hebrew), respond ONLY with a JSON object: {\"calories\": <number>, \"name\": \"<cleaned food name in Hebrew>\"}. Estimate realistic calories. No other text.",
        messages: [{ role: "user", content: name }]
      })
    });

    const data = await response.json();
    const text = data.content[0].text.trim();
    const parsed = JSON.parse(text.replace(/```json|```/g, '').trim());

    document.getElementById('foodCal').value = parsed.calories;
    if (parsed.name) document.getElementById('foodName').value = parsed.name;

    statusEl.textContent = `✅ הערכה: ${parsed.calories} קק"ל`;
  } catch(e) {
    statusEl.textContent = '❌ שגיאה בהערכה - הזיני קלוריות ידנית';
  }
}

async function handleImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  const previewDiv = document.getElementById("imagePreview");
  const previewImg = document.getElementById("previewImg");
  const r0 = new FileReader();
  r0.onload = e => { previewImg.src = e.target.result; previewDiv.style.display = "block"; };
  r0.readAsDataURL(file);

  const statusEl = document.getElementById("aiStatus");
  statusEl.textContent = "⏳ מזהה אוכל בתמונה...";
  statusEl.classList.add("visible");

  try {
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = () => rej(new Error("Read failed"));
      r.readAsDataURL(file);
    });
    const mediaType = file.type || "image/jpeg";
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 200,
        system: "You are a calorie estimation assistant. When given an image of food, identify what food items you see and estimate total calories. Respond ONLY with a JSON object: {\"calories\": <number>, \"name\": \"<food description in Hebrew>\"}. Be realistic. No other text.",
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64 } },
          { type: "text", text: "זהי את האוכל בתמונה והעריכי קלוריות." }
        ]}]
      })
    });
    const data = await response.json();
    const text = data.content[0].text.trim();
    const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
    document.getElementById("foodName").value = parsed.name;
    document.getElementById("foodCal").value = parsed.calories;
    statusEl.textContent = "✅ זיהיתי: " + parsed.name + " — " + parsed.calories + " קק\"ל";
  } catch(e) {
    statusEl.textContent = "❌ לא הצלחתי לזהות — הזיני ידנית";
  }
  event.target.value = "";
}

render();
</script>
</body>
</html>
